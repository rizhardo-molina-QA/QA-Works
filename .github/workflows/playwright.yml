name: Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # 🛠️ Le ordenamos a GitHub entrar a la carpeta donde realmente vive tu proyecto Node/Playwright
    defaults:
      run:
        working-directory: ./Test Proyects

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      run: npm test
      env:
        CI: true

    - name: Upload Test Report Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        # ⚠️ Guardamos el reporte apuntando a la ruta interna correcta
        path: Test Proyects/playwright-report/
        retention-days: 30
