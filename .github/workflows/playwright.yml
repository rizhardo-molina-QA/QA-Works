name: Playwright E2E Tests
on:
  workflow_dispatch:
    inputs:
      repeat_mode:
        description: "Choose whether to repeat tests by time or by run count."
        required: true
        type: choice
        options:
          - "Timer (minutes max 90)"
          - "Run Count(Number of runs could not exceed the 90 minutes limit)"
        default: "Timer (minutes)"
      repeat_value:
        description: "Enter minutes (1-90) for Timer, or the number of test runs for Run Count."
        required: true
        default: 0
        type: number
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Test Proyects

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Repeat Playwright Tests by Timer or Run Count
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        if ! [[ "$REPEAT_VALUE" =~ ^[1-9][0-9]*$ ]]; then
          echo "repeat_value must be a positive whole number."
          exit 1
        fi

        failed=0
        iteration=0

        case "$REPEAT_MODE" in
          "Timer (minutes)"|timer|Timer)
            if (( REPEAT_VALUE > 60 )); then
              echo "Timer mode accepts a maximum of 60 minutes."
              exit 1
            fi

            duration_seconds=$((REPEAT_VALUE * 60))
            start_time=$SECONDS
            while (( SECONDS - start_time < duration_seconds )); do
              iteration=$((iteration + 1))
              echo "Starting Playwright run #$iteration."
              if ! npx playwright test; then
                failed=1
                echo "Playwright run #$iteration failed; continuing until the timer ends."
              fi
            done
            ;;
          "Run Count"|count|Count)
            for ((iteration = 1; iteration <= REPEAT_VALUE; iteration++)); do
              echo "Starting Playwright run #$iteration of $REPEAT_VALUE."
              if ! npx playwright test; then
                failed=1
                echo "Playwright run #$iteration failed; continuing with the remaining runs."
              fi
            done
            ;;
          *)
            echo "Select a valid repeat mode."
            exit 1
            ;;
        esac

        if (( failed )); then
          echo "At least one Playwright run failed."
          exit 1
        fi
      env:
        CI: true
        REPEAT_MODE: ${{ inputs.repeat_mode }}
        REPEAT_VALUE: ${{ inputs.repeat_value }}

    - name: Run Playwright Tests
      if: ${{ github.event_name != 'workflow_dispatch' }}
      run: npx playwright test
      env:
        CI: true

    - name: Upload Test Report Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: Test Proyects/playwright-report/
        retention-days: 30
