name: 2026 Azure GFR QED API PT

on:
  workflow_dispatch:
    inputs:
      DB041_ACTION_USER_COUNT:
        description: 'This only needs to be run in case of 041 DB execution is required. You can set user at 12 to get 500 count of 041 reports '
        required: true
        default: '0'
      ALLDB_ACTION_USER_COUNT:
        description: 'Number of users for all 4 threadgroup'
        required: true
        default: '6'
      THINKTIME:
        description: 'ThinkTime'
        required: true
        default: '10000'
      RAMP_UP:
        description: 'Ramp Up for all the users'
        required: true
        default: '60'
      DURATION:
        description: 'Duration of the test'
        required: true
        default: '3600'
#  schedule:
 #   - cron: '50 0 * * *'  # Runs every day at 05:05 UTC (10:35 AM IST)

jobs:
  jmeter-test:
    runs-on: APIRunner1
    timeout-minutes: 120

    env:
      DD_API_KEY: ${{ secrets.AZURE_DD_APIKEY }}

    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List files in working directory
        run: |
          echo "Current directory: $(pwd)"
          ls -l

      - name: Set up JMeter and Plugins
        run: |
          wget https://downloads.apache.org//jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "JMETER_HOME=$PWD/apache-jmeter-5.6.3" >> $GITHUB_ENV
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

          # Download required plugins
          curl -o $PWD/apache-jmeter-5.6.3/lib/json-lib-2.4-jdk15.jar https://repo1.maven.org/maven2/net/sf/json-lib/json-lib/2.4/json-lib-2.4-jdk15.jar
          curl -o $PWD/apache-jmeter-5.6.3/lib/jmeter-plugins-cmn-jmeter-0.7.jar https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-cmn-jmeter/0.7/jmeter-plugins-cmn-jmeter-0.7.jar
          curl -o $PWD/apache-jmeter-5.6.3/lib/jmeter-parallel-0.12.jar https://repo1.maven.org/maven2/com/blazemeter/jmeter-parallel/0.12/jmeter-parallel-0.12.jar
          curl -o $PWD/apache-jmeter-5.6.3/lib/jmeter-plugins-casutg-2.10.jar https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-casutg/2.10/jmeter-plugins-casutg-2.10.jar

          # Download and set up PluginsManagerCMD
          wget https://repo1.maven.org/maven2/kg/apc/cmdrunner/2.2.1/cmdrunner-2.2.1.jar -O $PWD/apache-jmeter-5.6.3/lib/cmdrunner-2.2.jar
          wget https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-manager/1.6/jmeter-plugins-manager-1.6.jar -O $PWD/apache-jmeter-5.6.3/lib/ext/jmeter-plugins-manager.jar
          java -cp "$PWD/apache-jmeter-5.6.3/lib/ext/jmeter-plugins-manager.jar:$PWD/apache-jmeter-5.6.3/lib/cmdrunner-2.2.jar" org.jmeterplugins.repository.PluginManagerCMDInstaller

          # Install DataDog plugin
          $PWD/apache-jmeter-5.6.3/bin/PluginsManagerCMD.sh install jmeter-datadog-backend-listener

          # Install plugins required for JMeterPluginsCMD aggregate CSV report generation:
          # jpgc-cmd  = provides JMeterPluginsCMD.sh
          # jpgc-synthesis = provides the AggregateReport plugin type used by the reporter
          $PWD/apache-jmeter-5.6.3/bin/PluginsManagerCMD.sh install jpgc-cmd,jpgc-synthesis

          # Download additional plugins
          curl -L https://github.com/OnkarWaman302/JTL-Rotating-Listener/releases/download/JTL/jmeter-plugins-rotating-listener-0.2.jar --output $PWD/apache-jmeter-5.6.3/lib/jmeter-plugins-rotating-listener-0.2.jar

      - name: Run JMeter Test
        run: |
          # Set defaults if variables are empty (for scheduled runs)
          DB041_ACTION_USER_COUNT="${{ github.event.inputs.DB041_ACTION_USER_COUNT }}"
          ALLDB_ACTION_USER_COUNT="${{ github.event.inputs.ALLDB_ACTION_USER_COUNT }}"
          THINKTIME="${{ github.event.inputs.THINKTIME }}"
          RAMP_UP="${{ github.event.inputs.RAMP_UP }}"
          DURATION="${{ github.event.inputs.DURATION }}"

          # Use defaults if any are unset (for scheduled runs)
          [ -z "$DB041_ACTION_USER_COUNT" ] && DB041_ACTION_USER_COUNT=0
          [ -z "$ALLDB_ACTION_USER_COUNT" ] && ALLDB_ACTION_USER_COUNT=6
          [ -z "$THINKTIME" ] && THINKTIME=10000
          [ -z "$RAMP_UP" ] && RAMP_UP=60
          [ -z "$DURATION" ] && DURATION=3600

          JMETER_SCRIPT="Azure QED/GFR_API_V3.2.2_AllDB_Azure.jmx"
          JMETER_RESULT="result_API.jtl"
          JMETER_LOG="jmeter_API.log"
          JMETER=$PWD/apache-jmeter-5.6.3/bin/jmeter

          # Set JVM memory parameters
          export JVM_ARGS="-Xms1G -Xmx6G -XX:MaxMetaspaceSize=192m"

          if [ ! -f "$JMETER_SCRIPT" ]; then
            echo "ERROR: JMeter script $JMETER_SCRIPT not found!"
            exit 1
          fi

          $JMETER \
            -JapiKey="$DD_API_KEY" \
            -JAPI041ActionsUser="$DB041_ACTION_USER_COUNT" \
            -JAllAPIActionsUser="$ALLDB_ACTION_USER_COUNT" \
            -JThinkTime="$THINKTIME" \
            -JRampupPeriod="$RAMP_UP" \
            -JDuration="$DURATION" \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.response_data=false \
            -Jjmeter.save.saveservice.samplerData=false \
            -Jjmeter.save.saveservice.requestHeaders=false \
            -Jjmeter.save.saveservice.responseHeaders=false \
            -Jjmeter.save.saveservice.url=false \
            -n -t "$JMETER_SCRIPT" \
            -l "$JMETER_RESULT" \
            -j "$JMETER_LOG"

      - name: Generate Aggregate CSV Report
        if: always()
        run: |
          JMETER_RESULT="result_API.jtl"
          AGGREGATE_REPORT="aggregate_report_API.csv"
          PLUGINS_CMD=$PWD/apache-jmeter-5.6.3/bin/JMeterPluginsCMD.sh

          if [ ! -f "$JMETER_RESULT" ]; then
            echo "WARNING: JTL result file not found, skipping aggregate report generation."
            exit 0
          fi

          echo "Generating aggregate CSV report from $JMETER_RESULT ..."
          $PLUGINS_CMD \
            --generate-csv "$AGGREGATE_REPORT" \
            --input-jtl "$JMETER_RESULT" \
            --plugin-type AggregateReport

          echo "Aggregate report generated: $AGGREGATE_REPORT"

      - name: Set timestamp (UTC)
        run: echo "STAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Upload JMeter Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Azure_Features-results-API-${{ env.STAMP }}
          path: |
            jmeter_API.log
            result_API.jtl
            TestErrors_API.jtl
            aggregate_report_API.csv
          if-no-files-found: warn
