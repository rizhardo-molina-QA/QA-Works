name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      repeat_mode:
        description: "Choose whether to repeat by time or by run count."
        required: true
        type: choice
        options:
          - timer
          - count
        default: timer
      repeat_value:
        description: "Minutes (1-60) for timer mode, or number of runs for count mode."
        required: true
        default: 60
        type: number
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Repeat Playwright tests by timer or run count
      if: ${{ github.event_name == 'workflow_dispatch' }}
      env:
        REPEAT_MODE: ${{ inputs.repeat_mode }}
        REPEAT_VALUE: ${{ inputs.repeat_value }}
      run: |
        if ! [[ "$REPEAT_VALUE" =~ ^[1-9][0-9]*$ ]]; then
          echo "repeat_value must be a positive whole number."
          exit 1
        fi

        failed=0
        iteration=0

        case "$REPEAT_MODE" in
          timer)
            if (( REPEAT_VALUE > 60 )); then
              echo "Timer mode accepts a maximum of 60 minutes."
              exit 1
            fi

            duration_seconds=$((REPEAT_VALUE * 60))
            start_time=$SECONDS
            while (( SECONDS - start_time < duration_seconds )); do
              iteration=$((iteration + 1))
              echo "Starting Playwright run #$iteration."
              if ! npx playwright test; then
                failed=1
                echo "Playwright run #$iteration failed; continuing until the timer ends."
              fi
            done
            ;;
          count)
            for ((iteration = 1; iteration <= REPEAT_VALUE; iteration++)); do
              echo "Starting Playwright run #$iteration of $REPEAT_VALUE."
              if ! npx playwright test; then
                failed=1
                echo "Playwright run #$iteration failed; continuing with the remaining runs."
              fi
            done
            ;;
          *)
            echo "repeat_mode must be timer or count."
            exit 1
            ;;
        esac

        if (( failed )); then
          echo "At least one Playwright run failed."
          exit 1
        fi
    - name: Run Playwright tests
      if: ${{ github.event_name != 'workflow_dispatch' }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
